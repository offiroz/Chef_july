<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef July - בית</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="home-container">
    <header class="home-header">
      <h1 id="greeting">שלום!</h1>
    </header>

    <div class="home-content">
      <div class="home-gif-section">
        <div id="home-anim" class="anim-container home-gif"></div>
      </div>

      <a href="/recipe" class="btn btn-primary btn-large btn-recipe">קבל מתכון</a>
    </div>

    <nav class="bottom-nav">
      <a href="/home" class="nav-item active">
        <span class="nav-icon">&#9751;</span>
        <span>בית</span>
      </a>
      <a href="/saved" class="nav-item">
        <span class="nav-icon">&#9733;</span>
        <span>שמורים</span>
      </a>
      <a href="/inspiration" class="nav-item">
        <span class="nav-icon">&#10024;</span>
        <span>השראה</span>
      </a>
      <a href="/profile" class="nav-item">
        <span class="nav-icon">&#9786;</span>
        <span>פרופיל</span>
      </a>
    </nav>
  </div>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script>
    ChefAnim.init('home-anim', 'idle', 'large');

    (async () => {
      try {
        const data = await callAPI('/auth/me');
        if (data && data.success) {
          document.getElementById('greeting').textContent = `שלום, ${data.user.username}!`;
        } else {
          window.location.href = '/login';
        }
      } catch (e) {
        window.location.href = '/login';
      }
    })();
  </script>
</body>
</html>
