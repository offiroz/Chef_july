<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef July - התחברות</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/assets/gifs/idle.gif" alt="Chef July" class="auth-gif" onerror="this.style.display='none'">
        <h1>Chef July</h1>
        <h2>התחברות</h2>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="identifier">שם משתמש או אימייל</label>
          <input type="text" id="identifier" name="identifier" required
                 placeholder="הקלד שם משתמש או אימייל">
          <span class="field-error" id="identifierError"></span>
        </div>

        <div class="form-group">
          <label for="password">סיסמה</label>
          <input type="password" id="password" name="password" required
                 placeholder="הקלד סיסמה">
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">התחבר</button>
      </form>

      <p class="auth-switch">עדיין אין לי חשבון <a href="/signup">צור חשבון</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
