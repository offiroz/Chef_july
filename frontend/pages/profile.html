<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef July - פרופיל</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="profile-page">
    <header class="page-header">
      <a href="/home" class="back-btn">&larr; חזרה</a>
      <h1>הפרופיל שלי</h1>
    </header>

    <div class="profile-content">
      <!-- User Info -->
      <div class="profile-card">
        <div id="profile-anim" class="anim-container profile-anim"></div>
        <h2 id="profile-username" class="profile-username"></h2>
        <p id="profile-email" class="profile-email"></p>
        <p id="profile-joined" class="profile-joined"></p>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <span id="stat-created" class="stat-number">0</span>
          <span class="stat-label">מתכונים נוצרו</span>
        </div>
        <div class="stat-card">
          <span id="stat-saved" class="stat-number">0</span>
          <span class="stat-label">מתכונים שמורים</span>
        </div>
        <div class="stat-card">
          <span id="stat-ratings" class="stat-number">0</span>
          <span class="stat-label">דירוגים</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="profile-actions">
        <a href="/settings" class="btn btn-secondary btn-full">הגדרות</a>
        <button id="logout-btn" class="btn btn-outline btn-full">התנתק</button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/home" class="nav-item">
        <span class="nav-icon">&#9751;</span>
        <span>בית</span>
      </a>
      <a href="/saved" class="nav-item">
        <span class="nav-icon">&#9733;</span>
        <span>שמורים</span>
      </a>
      <a href="/inspiration" class="nav-item">
        <span class="nav-icon">&#10024;</span>
        <span>השראה</span>
      </a>
      <a href="/profile" class="nav-item active">
        <span class="nav-icon">&#9786;</span>
        <span>פרופיל</span>
      </a>
    </nav>
  </div>

  <script src="/js/animations.js"></script>
  <script src="/js/api.js"></script>
  <script>
    ChefAnim.init('profile-anim', 'idle', 'small');

    (async () => {
      try {
        const data = await callAPI('/users/profile');
        if (!data || !data.success) {
          window.location.href = '/login';
          return;
        }

        document.getElementById('profile-username').textContent = data.user.username;
        document.getElementById('profile-email').textContent = data.user.email;

        const joined = new Date(data.user.created_at);
        document.getElementById('profile-joined').textContent =
          `הצטרף ב-${joined.toLocaleDateString('he-IL')}`;

        document.getElementById('stat-created').textContent = data.stats.recipesCreated;
        document.getElementById('stat-saved').textContent = data.stats.recipesSaved;
        document.getElementById('stat-ratings').textContent = data.stats.ratingsGiven;
      } catch (e) {
        window.location.href = '/login';
      }
    })();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await callAPI('/auth/logout', { method: 'POST' });
      } catch (e) {
        // ignore
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
